#cloud-config
# Omni Line DigitalOcean droplet user-data.
# Paste into the Droplet create UI (User data) or pass to doctl --user-data-file.
#
# Recommended: Ubuntu 24.04, 4 GB RAM / 2 vCPU.
# Self-host firewall: 22 + 8080.
# Managed Cloud: 22 from ops CIDRs only; 80/443 public (8080 stays on localhost).
#
# Optional: set OMNI_URL / OMNI_VERSION / OMNI_PORT via write_files env before runcmd,
# or edit the runcmd exports below.

package_update: true
package_upgrade: false

packages:
  - curl
  - ca-certificates
  - openssl

runcmd:
  - |
    set -eu
    export OMNI_DIR=/opt/omni-line
    export OMNI_PORT=8080
    # export OMNI_URL=https://registry.example.com
    # export OMNI_VERSION=0.1.3
    curl -fsSL https://raw.githubusercontent.com/omni-line/releases/main/cloud/cloud-init.sh -o /tmp/omni-cloud-init.sh
    bash /tmp/omni-cloud-init.sh
    curl -fsSL https://raw.githubusercontent.com/omni-line/releases/main/cloud/managed-overlay.sh -o /tmp/omni-managed-overlay.sh
    bash /tmp/omni-managed-overlay.sh
