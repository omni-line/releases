AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Omni Line single-VM deploy. Provisions an Ubuntu 24.04 EC2 instance, opens
  SSH and the app port, and runs the official cloud-init bootstrap (Docker +
  install.sh). Same Compose stack as the Docker Compose installer.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Instance
        Parameters:
          - InstanceType
          - KeyName
          - VolumeSize
      - Label:
          default: Network
        Parameters:
          - AllowedCidr
          - OmniPort
      - Label:
          default: Omni Line
        Parameters:
          - OmniVersion
          - OmniUrl

Parameters:
  InstanceType:
    Type: String
    Default: t3.medium
    Description: EC2 instance type (~2 vCPU / 4 GiB recommended).
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
      - m6i.large

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair for SSH.

  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to reach SSH and the Omni Line port (tighten in production).
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: Must be a valid IPv4 CIDR (e.g. 203.0.113.0/24).

  OmniPort:
    Type: Number
    Default: 8080
    MinValue: 1
    MaxValue: 65535
    Description: Host port for the Omni Line UI / API.

  OmniVersion:
    Type: String
    Default: ""
    Description: Optional semver pin for GHCR images (empty = latest release assets).

  OmniUrl:
    Type: String
    Default: ""
    Description: >
      Optional public origin override (e.g. https://registry.example.com).
      Leave empty to use http://PUBLIC_IP:OmniPort from instance metadata.

  VolumeSize:
    Type: Number
    Default: 40
    MinValue: 20
    MaxValue: 500
    Description: Root EBS volume size in GiB.

Conditions:
  HasOmniVersion: !Not [!Equals [!Ref OmniVersion, ""]]
  HasOmniUrl: !Not [!Equals [!Ref OmniUrl, ""]]

Resources:
  OmniSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Omni Line SSH and application port
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedCidr
          Description: SSH
        - IpProtocol: tcp
          FromPort: !Ref OmniPort
          ToPort: !Ref OmniPort
          CidrIp: !Ref AllowedCidr
          Description: Omni Line
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-sg"

  OmniInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      ImageId: "{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id}}"
      SecurityGroupIds:
        - !Ref OmniSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euo pipefail
            export OMNI_PORT="${OmniPort}"
            export OMNI_DIR="/opt/omni-line"
            ${VersionExport}
            ${UrlExport}
            curl -fsSL https://raw.githubusercontent.com/omni-line/releases/main/cloud/cloud-init.sh | bash
          - VersionExport: !If
              - HasOmniVersion
              - !Sub 'export OMNI_VERSION="${OmniVersion}"'
              - ""
            UrlExport: !If
              - HasOmniUrl
              - !Sub 'export OMNI_URL="${OmniUrl}"'
              - ""
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-omni-line"

  OmniEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref OmniInstance
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-eip"

Outputs:
  InstanceId:
    Description: EC2 instance ID
    Value: !Ref OmniInstance

  PublicIp:
    Description: Elastic IP address
    Value: !Ref OmniEIP

  PublicUrl:
    Description: Default HTTP origin (override OmniUrl if you set a custom domain)
    Value: !Sub
      - "http://${PublicIp}:${Port}"
      - PublicIp: !Ref OmniEIP
        Port: !Ref OmniPort

  SshCommand:
    Description: SSH as ubuntu
    Value: !Sub
      - "ssh -i <your-key.pem> ubuntu@${PublicIp}"
      - PublicIp: !Ref OmniEIP

  Docs:
    Description: Cloud install documentation
    Value: https://omniline.app/docs/install/cloud
